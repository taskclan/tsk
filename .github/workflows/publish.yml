name: Publish @taskclan/tsk

# Publishes to npmjs.org on a version tag (v0.2.2) or manual dispatch.
# Requires NPM_TOKEN: an npmjs.org automation token with publish rights on @taskclan.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
